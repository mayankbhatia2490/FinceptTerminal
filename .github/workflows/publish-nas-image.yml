name: Publish NAS Docker Image

# Builds the `nas` target and pushes it to GitHub Container Registry.
# The Synology DS220+ (and any compatible NAS) can then pull the image
# directly from GHCR instead of building locally on the slow Celeron CPU.
#
# Image: ghcr.io/fincept-corporation/finceptterminal:nas-latest
#        ghcr.io/fincept-corporation/finceptterminal:nas-<tag>

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-nas-image:
    name: Build & Push NAS Image (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nas-latest
            type=semver,pattern=nas-{{version}}
            type=semver,pattern=nas-{{major}}.{{minor}}

      - name: Build and push NAS image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: nas
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
